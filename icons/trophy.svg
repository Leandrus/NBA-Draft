<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldCup" x1="16" y1="6" x2="48" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff5a5"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldBase" x1="20" y1="46" x2="44" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="trophyGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Cup handles -->
  <path d="M18 14H10a6 6 0 0 0-6 6v4a12 12 0 0 0 12 12h2" stroke="url(#goldCup)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M46 14h8a6 6 0 0 1 6 6v4a12 12 0 0 1-12 12h-2" stroke="url(#goldCup)" stroke-width="4" stroke-linecap="round" fill="none"/>
