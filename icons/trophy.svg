  <!-- Cup rim -->
  <path d="M14 8h36v3H14z" fill="#fef08a" stroke="#b45309" stroke-width="1.5"/>
  <!-- Stem -->
  <path d="M30 42h4v8h-4z" fill="url(#goldCup)" stroke="#92400e" stroke-width="1.5"/>
