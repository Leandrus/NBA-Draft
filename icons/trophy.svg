  <path d="M22 50h20l3 8H19l3-8z" fill="url(#goldBase)" stroke="#78350f" stroke-width="2"/>
  <rect x="16" y="58" width="32" height="4" rx="1.5" fill="#451a03"/>
  <!-- Star on Cup -->
  <path d="M32 17l1.8 3.8 4.2.6-3 3 .7 4.1-3.7-2-3.7 2 .7-4.1-3-3 4.2-.6z" fill="#ffffff" opacity="0.9"/>
